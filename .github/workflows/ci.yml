name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

env:
  REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore .\UsageIndicatorForCodex.sln

      - name: Build
        run: dotnet build .\UsageIndicatorForCodex.sln --configuration Release --no-restore

      - name: Test
        run: dotnet run --project .\tests\UsageIndicatorForCodex.Tests\UsageIndicatorForCodex.Tests.csproj --configuration Release --no-build

      - name: Validate repository and version contract
        shell: pwsh
        run: .\tests\repository-contract.ps1

      - name: Restore win-x64 runtime
        run: dotnet restore .\src\UsageIndicatorForCodex\UsageIndicatorForCodex.csproj --runtime win-x64

      - name: Publish self-contained win-x64 release
        shell: pwsh
        run: |
          dotnet publish .\src\UsageIndicatorForCodex\UsageIndicatorForCodex.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishProfile=win-x64-self-contained `
            -p:RepositoryUrl="$env:REPOSITORY_URL" `
            --output (Join-Path $env:RUNNER_TEMP 'publish')

      - name: Build portable and installed launchers
        shell: pwsh
        run: |
          $publishDirectory = Join-Path $env:RUNNER_TEMP 'publish'
          .\scripts\build-launcher.ps1 `
            -Layout Portable `
            -OutputPath (Join-Path $publishDirectory 'UsageIndicatorForCodex.exe')
          .\scripts\build-launcher.ps1 `
            -Layout Installed `
            -OutputPath (Join-Path $env:RUNNER_TEMP 'usage-indicator.exe')

      - name: Package portable release and validate launchers
        shell: pwsh
        run: |
          . .\scripts\product-metadata.ps1
          $metadata = Get-UsageIndicatorProductMetadata
          $publishDirectory = Join-Path $env:RUNNER_TEMP 'publish'
          $assetDirectory = Join-Path $env:RUNNER_TEMP 'release-assets'
          $archive = Join-Path $assetDirectory $metadata.PortableAssetName
          $probe = '.\tests\UsageIndicatorForCodex.LauncherProbe\bin\Release\net8.0\UsageIndicatorForCodex.LauncherProbe.exe'
          .\scripts\package-release.ps1 -PublishDirectory $publishDirectory -ArchivePath $archive
          .\tests\console-contract.ps1 `
            -PublishDirectory $publishDirectory `
            -LauncherProbe $probe `
            -InstalledLauncher (Join-Path $env:RUNNER_TEMP 'usage-indicator.exe') `
            -ArchivePath $archive

      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.1 --yes --no-progress

      - name: Verify Inno Setup compiler version
        shell: pwsh
        run: |
          $expectedInnoSetupVersion = '6.7.1'
          $compilerPath = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          $compiler = .\scripts\verify-inno-setup.ps1 `
            -CompilerPath $compilerPath `
            -ExpectedVersion $expectedInnoSetupVersion
          "INNO_SETUP_COMPILER=$($compiler.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and validate installer
        shell: pwsh
        run: |
          $assetDirectory = Join-Path $env:RUNNER_TEMP 'release-assets'
          $installer = .\scripts\build-installer.ps1 `
            -PublishDirectory (Join-Path $env:RUNNER_TEMP 'publish') `
            -InstalledLauncher (Join-Path $env:RUNNER_TEMP 'usage-indicator.exe') `
            -OutputDirectory $assetDirectory `
            -RepositoryUrl $env:REPOSITORY_URL `
            -IsccPath $env:INNO_SETUP_COMPILER
          .\tests\installer-contract.ps1 -InstallerPath $installer.FullName

      - name: Generate checksums and validate exact release assets
        shell: pwsh
        run: |
          . .\scripts\product-metadata.ps1
          $metadata = Get-UsageIndicatorProductMetadata
          $assetDirectory = Join-Path $env:RUNNER_TEMP 'release-assets'
          .\scripts\release-assets.ps1 `
            -InstallerPath (Join-Path $assetDirectory $metadata.InstallerAssetName) `
            -PortableArchivePath (Join-Path $assetDirectory $metadata.PortableAssetName) `
            -OutputDirectory $assetDirectory
          .\tests\release-contract.ps1 -AssetDirectory $assetDirectory

      - name: Upload validated release assets
        uses: actions/upload-artifact@v4
        with:
          name: usage-indicator-for-codex-v0.1.0
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
